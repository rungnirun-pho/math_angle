<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บทเรียนสำเร็จรูป มุมมหาสนุก (Fun with Angles)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#DFF6FB;--bg2:#BCE8F2;--navy:#143A74;--navy2:#1E5AA0;--gold:#FFC328;
  --cyan:#00B4D8;--green:#2FBF71;--lime:#9BC53D;--pink:#F0509E;--purple:#9B5DE5;
  --ink:#243B53;--muted:#5B7290;--white:#fff;--shadow:0 10px 30px rgba(20,58,116,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Prompt',sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden;}
#doodles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
#doodles span{position:absolute;font-weight:800;opacity:.10;color:var(--navy);user-select:none;}
#app{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:14px 14px 50px;min-height:100vh;}
.hidden{display:none!important;}
.topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;}
.title-pill{background:var(--navy);color:#fff;padding:10px 20px;border-radius:30px;font-weight:800;font-size:clamp(16px,4vw,24px);box-shadow:var(--shadow);border:3px solid #fff;}
.title-pill .y{color:var(--gold);}
.toolbar{display:flex;gap:8px;align-items:center;}
.chip{background:#fff;border-radius:24px;padding:8px 14px;font-weight:700;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;border:2px solid #fff;font-size:15px;}
.iconbtn{width:46px;height:46px;border-radius:50%;border:none;background:#fff;box-shadow:var(--shadow);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:.2s;}
.iconbtn:active{transform:scale(.9);}
.mascot-row{display:flex;align-items:flex-end;gap:12px;margin:6px 0 16px;}
.mascot{flex-shrink:0;animation:bob 2.6s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bubble{background:#fff;border-radius:20px;padding:12px 18px;box-shadow:var(--shadow);position:relative;font-size:clamp(14px,3.3vw,17px);font-weight:500;border:2px solid #fff;flex:1;}
.bubble::after{content:"";position:absolute;left:-12px;bottom:18px;border:8px solid transparent;border-right-color:#fff;}

/* learning path menu */
.path{display:flex;flex-direction:column;gap:11px;}
.step{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;border:3px solid #fff;transition:.18s;border-left:7px solid var(--c,#00B4D8);}
.step:hover{transform:translateX(5px);}
.step:active{transform:scale(.99);}
.step .ic{font-size:30px;width:46px;text-align:center;flex-shrink:0;}
.step .body{flex:1;}
.step .body h3{font-size:17px;font-weight:800;color:var(--navy);}
.step .body p{font-size:13px;color:var(--muted);font-weight:400;}
.step .status{font-size:24px;flex-shrink:0;}
.step.section{background:transparent;box-shadow:none;border:none;padding:4px 6px 0;cursor:default;border-left:none;}
.step.section h4{color:var(--navy);font-weight:800;font-size:15px;opacity:.8;}

.screen{background:rgba(255,255,255,.6);border-radius:26px;padding:18px;box-shadow:var(--shadow);border:3px solid #fff;backdrop-filter:blur(4px);}
.scr-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.back{background:var(--navy);color:#fff;border:none;border-radius:20px;padding:9px 18px;font-weight:700;font-family:inherit;cursor:pointer;font-size:15px;box-shadow:var(--shadow);}
.back:active{transform:scale(.95);}
.scr-title{font-size:clamp(17px,4.2vw,23px);font-weight:800;color:var(--navy);}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;}
.panel{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);width:100%;max-width:440px;}
.bigbtn{background:linear-gradient(135deg,var(--gold),#ff9f1c);color:#fff;border:none;border-radius:24px;padding:13px 30px;font-weight:800;font-size:17px;font-family:inherit;cursor:pointer;box-shadow:var(--shadow);}
.bigbtn:active{transform:scale(.96);}
.readout{font-size:30px;font-weight:900;font-family:monospace;}
.infolist{list-style:none;}
.infolist li{background:#fff;border-radius:14px;padding:11px 16px;margin-bottom:9px;box-shadow:var(--shadow);font-size:15px;display:flex;gap:10px;align-items:flex-start;}
.infolist li .b{font-size:20px;}

.typewrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.typechip{border:none;border-radius:18px;padding:12px 8px;color:#fff;font-family:inherit;font-weight:700;cursor:pointer;width:104px;box-shadow:var(--shadow);transition:.2s;text-align:center;}
.typechip:active{transform:scale(.95);}
.typechip small{display:block;font-weight:400;font-size:11px;opacity:.9;}
.typechip svg{display:block;margin:0 auto 4px;}

.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:460px;}
.opt{background:#fff;border:3px solid #fff;border-radius:18px;padding:12px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;transition:.15s;font-size:15px;text-align:center;}
.opt:active{transform:scale(.96);}
.opt.correct{border-color:var(--green);background:#e9fbf1;}
.opt.wrong{border-color:#ff5a5f;background:#ffecec;}

.hud{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:460px;font-weight:800;}
.timerbar{width:100%;max-width:460px;height:14px;border-radius:10px;background:#fff;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.15);}
.timerfill{height:100%;background:linear-gradient(90deg,#2FBF71,#FFC328,#F0509E);transition:width .25s linear;}
.combo{color:var(--pink);font-size:15px;min-height:20px;font-weight:800;}
.ask{font-size:clamp(18px,4.6vw,26px);font-weight:900;color:var(--navy);text-align:center;}
.ask b{padding:2px 14px;border-radius:14px;color:#fff;}
.progress{display:flex;gap:5px;justify-content:center;margin-bottom:6px;flex-wrap:wrap;}
.dot{width:13px;height:13px;border-radius:50%;background:#cfe6ef;}
.dot.on{background:var(--gold);} .dot.cur{background:var(--navy);transform:scale(1.3);}

.result{text-align:center;}
.result .big{font-size:60px;}
.result .score{font-size:44px;font-weight:900;color:var(--navy);}
.starline{font-size:38px;letter-spacing:5px;margin:6px 0;}
.cmp{display:flex;gap:14px;justify-content:center;margin:14px 0;flex-wrap:wrap;}
.cmpbox{background:#fff;border-radius:18px;padding:14px 22px;box-shadow:var(--shadow);min-width:130px;}
.cmpbox .l{font-size:13px;color:var(--muted);} .cmpbox .v{font-size:30px;font-weight:900;}

/* certificate */
#cert{background:linear-gradient(135deg,#fffdf5,#fff);border:10px double var(--gold);border-radius:14px;padding:26px 22px;text-align:center;max-width:560px;margin:14px auto;box-shadow:var(--shadow);}
#cert .seal{font-size:46px;}
#cert h2{color:var(--navy);font-size:26px;margin:4px 0;}
#cert .nm{font-size:28px;font-weight:900;color:var(--pink);border-bottom:2px dashed #ddd;display:inline-block;padding:4px 30px;margin:8px 0;}
#cert .sub{color:var(--muted);font-size:15px;}
#cert .row{display:flex;justify-content:center;gap:20px;margin:12px 0;}
.nameinput{font-family:inherit;font-size:18px;padding:10px 16px;border-radius:14px;border:2px solid var(--cyan);text-align:center;width:80%;max-width:340px;}

.footer{text-align:center;margin-top:22px;color:var(--navy);font-weight:600;font-size:13px;opacity:.85;}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:50;pointer-events:none;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9;}}

@media print{
  body{background:#fff;} #doodles,.topbar,.no-print,.scr-head{display:none!important;}
  .screen{box-shadow:none;border:none;background:#fff;} #cert{border-color:#caa400;}
}
</style>
</head>
<body>
<div id="doodles"></div>
<div id="app"></div>
<script>
/* ============ STATE ============ */
const S={screen:'home',sound:true,name:'',
  done:{howto:false,objective:false,learn:false,types:false,symbol:false,explore:false,game:false,clock:false},
  pre:null,post:null,stars:0,bestGame:0,bestClock:0};
const app=document.getElementById('app');

/* doodles */
(function(){const d=document.getElementById('doodles');const sym=['π','∠','△','+','×','÷','√','7','%','□','◯','45°','90°'];
for(let i=0;i<26;i++){const s=document.createElement('span');s.textContent=sym[i%sym.length];
s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.fontSize=(18+Math.random()*42)+'px';
s.style.transform='rotate('+(Math.random()*60-30)+'deg)';d.appendChild(s);}})();

/* sound */
let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function beep(f,d,t,v){if(!S.sound)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
o.type=t||'sine';o.frequency.value=f;g.gain.value=v||0.18;o.connect(g);g.connect(c.destination);
const tt=c.currentTime;o.start(tt);g.gain.exponentialRampToValueAtTime(0.0001,tt+(d||0.15));o.stop(tt+(d||0.15));}
function sClick(){beep(520,0.08,'square',0.12);}
function sCorrect(){beep(660,0.12,'sine',0.18);setTimeout(()=>beep(880,0.16,'sine',0.18),90);}
function sWrong(){beep(180,0.22,'sawtooth',0.16);}
function sWin(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'triangle',0.2),i*120));}
function sStar(){beep(1320,0.1,'triangle',0.18);setTimeout(()=>beep(1760,0.14,'triangle',0.18),80);}

/* angle helpers */
const TYPES=[
{key:'acute',th:'มุมแหลม',en:'Acute',color:'#00B4D8',test:d=>d>0&&d<90},
{key:'right',th:'มุมฉาก',en:'Right',color:'#2FBF71',test:d=>d===90},
{key:'obtuse',th:'มุมป้าน',en:'Obtuse',color:'#9BC53D',test:d=>d>90&&d<180},
{key:'straight',th:'มุมตรง',en:'Straight',color:'#F0509E',test:d=>d===180},
{key:'reflex',th:'มุมกลับ',en:'Reflex',color:'#9B5DE5',test:d=>d>180&&d<360},
];
function typeOf(d){d=((Math.round(d)%360)+360)%360;if(d===0)d=1;return TYPES.find(t=>t.test(d))||TYPES[0];}
function angleSVG(deg,size,opts){opts=opts||{};const c=size/2,R=size*0.36,arm=size*0.40;
const t=typeOf(deg),col=opts.color||t.color,rad=deg*Math.PI/180;
const ex=c+arm*Math.cos(-rad),ey=c+arm*Math.sin(-rad);
const arcR=R*0.5,ax=c+arcR*Math.cos(-rad),ay=c+arcR*Math.sin(-rad),large=deg>180?1:0;
let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
if(opts.bg!==false)s+=`<circle cx="${c}" cy="${c}" r="${c-2}" fill="#F2FBFE" stroke="#cfeaf3" stroke-width="2"/>`;
if(deg>0&&deg<360)s+=`<path d="M ${c+arcR} ${c} A ${arcR} ${arcR} 0 ${large} 0 ${ax} ${ay}" fill="${col}33" stroke="${col}" stroke-width="3"/>`;
if(deg===90)s+=`<rect x="${c+6}" y="${c-18}" width="12" height="12" fill="none" stroke="${col}" stroke-width="2"/>`;
s+=`<line x1="${c}" y1="${c}" x2="${c+arm}" y2="${c}" stroke="#5B7290" stroke-width="4" stroke-linecap="round"/>`;
s+=`<line x1="${c}" y1="${c}" x2="${ex}" y2="${ey}" stroke="${col}" stroke-width="4" stroke-linecap="round"/>`;
s+=`<circle cx="${c}" cy="${c}" r="5" fill="${col}"/>`;
if(opts.handle)s+=`<circle cx="${ex}" cy="${ey}" r="11" fill="${col}" fill-opacity=".25" stroke="${col}" stroke-width="3"/>`;
if(opts.labels){s+=`<text x="${c}" y="${c+22}" text-anchor="middle" font-size="13" fill="#F0509E" font-weight="bold">จุดยอดมุม</text>`;}
if(opts.deg)s+=`<text x="${c}" y="${size-10}" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="${col}">${Math.round(deg)}°</text>`;
s+=`</svg>`;return s;}

function mascot(size){size=size||96;return `<svg class="mascot" width="${size}" height="${size}" viewBox="0 0 100 100">
<ellipse cx="50" cy="92" rx="26" ry="5" fill="#143A74" opacity=".12"/>
<path d="M14 70 A36 36 0 0 1 86 70 Z" fill="#00B4D8" stroke="#143A74" stroke-width="3"/>
<path d="M24 70 A26 26 0 0 1 76 70 Z" fill="#E8FAFF"/>
<g stroke="#143A74" stroke-width="1.4"><line x1="50" y1="44" x2="50" y2="50"/><line x1="32" y1="48" x2="34" y2="54"/>
<line x1="68" y1="48" x2="66" y2="54"/><line x1="22" y1="58" x2="27" y2="61"/><line x1="78" y1="58" x2="73" y2="61"/></g>
<circle cx="40" cy="62" r="6" fill="#fff" stroke="#143A74" stroke-width="2"/><circle cx="60" cy="62" r="6" fill="#fff" stroke="#143A74" stroke-width="2"/>
<circle cx="41" cy="63" r="2.6" fill="#143A74"/><circle cx="61" cy="63" r="2.6" fill="#143A74"/>
<path d="M43 70 Q50 76 57 70" fill="none" stroke="#143A74" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="33" cy="69" r="3" fill="#F0509E" opacity=".5"/><circle cx="67" cy="69" r="3" fill="#F0509E" opacity=".5"/>
<line x1="50" y1="70" x2="50" y2="34" stroke="#FFC328" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="32" r="4" fill="#FFC328"/></svg>`;}

function go(scr){S.screen=scr;sClick();render();window.scrollTo(0,0);}
function starStr(n,max){let s='';for(let i=0;i<max;i++)s+=i<n?'⭐':'☆';return s;}
function recalcStars(){let s=0;Object.values(S.done).forEach(v=>{if(v)s++;});if(S.pre!=null)s++;if(S.post!=null)s++;S.stars=s;}
function toggleSound(){S.sound=!S.sound;if(S.sound){ac();sClick();}render();}
function topBar(){recalcStars();return `<div class="topbar">
<div class="title-pill"><span class="y">มุม</span>มหาสนุก</div>
<div class="toolbar"><div class="chip">⭐ <span>${S.stars}</span></div>
<button class="iconbtn" onclick="toggleSound()">${S.sound?'🔊':'🔇'}</button></div></div>`;}
function chk(k){return S.done[k]?'✅':'⭕';}

/* ============ HOME / LEARNING PATH ============ */
function renderHome(){
  app.innerHTML=topBar()+`
  <div class="mascot-row">${mascot(96)}
    <div class="bubble">สวัสดีจ้า! ฉัน <b>น้องโปร</b> 🤖 นี่คือ<b>บทเรียนสำเร็จรูป</b> เรื่องมุม เรียนตามลำดับจากบนลงล่างได้เลย ทำครบรับ ⭐ และ<b>เกียรติบัตร</b>!</div></div>
  <div class="path">
    <div class="step section"><h4>① เตรียมความพร้อม</h4></div>
    <div class="step" style="--c:#1E5AA0" onclick="go('howto')"><div class="ic">📖</div><div class="body"><h3>วิธีใช้บทเรียน</h3><p>อ่านก่อนเริ่มเรียน</p></div><div class="status">${chk('howto')}</div></div>
    <div class="step" style="--c:#1E5AA0" onclick="go('objective')"><div class="ic">🎯</div><div class="body"><h3>จุดประสงค์การเรียนรู้</h3><p>สิ่งที่จะได้เรียนรู้</p></div><div class="status">${chk('objective')}</div></div>
    <div class="step" style="--c:#F0509E" onclick="quizStart('pre')"><div class="ic">📝</div><div class="body"><h3>แบบทดสอบก่อนเรียน</h3><p>10 ข้อ · ${S.pre!=null?('ได้ '+S.pre+'/10'):'ยังไม่ได้ทำ'}</p></div><div class="status">${S.pre!=null?'✅':'⭕'}</div></div>
    <div class="step section"><h4>② บทเรียน</h4></div>
    <div class="step" style="--c:#00B4D8" onclick="go('learn')"><div class="ic">🧭</div><div class="body"><h3>บทที่ 1 รู้จักมุม</h3><p>ส่วนประกอบ + ลากสร้างมุม</p></div><div class="status">${chk('learn')}</div></div>
    <div class="step" style="--c:#2FBF71" onclick="go('types')"><div class="ic">🎨</div><div class="body"><h3>บทที่ 2 ชนิดของมุม</h3><p>มุม 5 ชนิด + ฝึกจำแนก</p></div><div class="status">${chk('types')}</div></div>
    <div class="step" style="--c:#9B5DE5" onclick="go('symbol')"><div class="ic">✏️</div><div class="body"><h3>บทที่ 3 ชื่อและสัญลักษณ์มุม</h3><p>การเขียน ∠ABC</p></div><div class="status">${chk('symbol')}</div></div>
    <div class="step" style="--c:#9BC53D" onclick="go('explore')"><div class="ic">🔍</div><div class="body"><h3>บทที่ 4 มุมรอบตัวเรา</h3><p>หามุมจากสิ่งของจริง</p></div><div class="status">${chk('explore')}</div></div>
    <div class="step section"><h4>③ กิจกรรมเกม</h4></div>
    <div class="step" style="--c:#F0509E" onclick="go('game')"><div class="ic">🎮</div><div class="body"><h3>เกมล่ามุม</h3><p>จับเวลา ทำคอมโบ · สถิติ ${S.bestGame}</p></div><div class="status">${chk('game')}</div></div>
    <div class="step" style="--c:#FFC328" onclick="go('clock')"><div class="ic">🕐</div><div class="body"><h3>เกมนาฬิกามหาสนุก</h3><p>ทายมุมจากเข็มนาฬิกา · สถิติ ${S.bestClock}</p></div><div class="status">${chk('clock')}</div></div>
    <div class="step section"><h4>④ วัดผลและรับรางวัล</h4></div>
    <div class="step" style="--c:#F0509E" onclick="quizStart('post')"><div class="ic">🏁</div><div class="body"><h3>แบบทดสอบหลังเรียน</h3><p>10 ข้อ · ${S.post!=null?('ได้ '+S.post+'/10'):'ยังไม่ได้ทำ'}</p></div><div class="status">${S.post!=null?'✅':'⭕'}</div></div>
    <div class="step" style="--c:#FFC328" onclick="go('result')"><div class="ic">🏆</div><div class="body"><h3>ผลการเรียน + เกียรติบัตร</h3><p>ดูคะแนนก่อน-หลัง และพิมพ์เกียรติบัตร</p></div><div class="status">🎓</div></div>
  </div>
  <div class="footer">โดย นางสาวรุ่งนิรันดร์ โพธิ์เพชรเล็บ · โรงเรียนหนองสำโรงวิทยา · สพป.อุดรธานี เขต 1<br>คณิตศาสตร์ ป.4 · ตัวชี้วัด ค 2.2 ป.4/1</div>`;
}

/* ============ HOWTO / OBJECTIVE ============ */
function renderHowto(){
  S.done.howto=true;
  app.innerHTML=topBar()+`<div class="screen"><div class="scr-head"><button class="back" onclick="go('home')">← สารบัญ</button><div class="scr-title">📖 วิธีใช้บทเรียน</div></div>
  <div class="mascot-row">${mascot(70)}<div class="bubble">ทำตามขั้นตอนนี้แล้วจะเก่งเรื่องมุมแน่นอน!</div></div>
  <ul class="infolist">
   <li><span class="b">1️⃣</span><div>ทำ <b>แบบทดสอบก่อนเรียน</b> เพื่อวัดความรู้เดิม (ยังไม่ต้องกังวลเรื่องคะแนน)</div></li>
   <li><span class="b">2️⃣</span><div>เรียน <b>บทที่ 1–4</b> ตามลำดับ ลองลากและแตะเล่นให้เข้าใจ</div></li>
   <li><span class="b">3️⃣</span><div>เล่น <b>กิจกรรมเกม</b> เพื่อฝึกฝนให้ชำนาญและสนุก</div></li>
   <li><span class="b">4️⃣</span><div>ทำ <b>แบบทดสอบหลังเรียน</b> แล้วดูว่าตัวเองเก่งขึ้นแค่ไหน</div></li>

 {t:'angle',deg:70,q:'มุมนี้คือมุมชนิดใด?'},
];
let qMode,qIdx,qScore,qLock,qChoices;
function quizStart(mode){qMode=mode;qIdx=0;qScore=0;sClick();quizRender();}
function quizRender(){
  if(qIdx>=QBANK.length)return quizDone();
  qLock=false;const item=QBANK[qIdx];
  let body='',choices=[];
  if(item.t==='angle'){
    const correct=typeOf(item.deg);
    let opts=[correct.key];const others=TYPES.map(t=>t.key).filter(k=>k!==correct.key).sort(()=>Math.random()-.5).slice(0,3);
    opts=opts.concat(others).sort(()=>Math.random()-.5);
    qChoices=opts.map(k=>({label:TYPES.find(t=>t.key===k).th,ok:k===correct.key}));
    body=`<div class="panel" style="text-align:center">${angleSVG(item.deg,170,{deg:true})}</div>`;
  } else {
    qChoices=item.ch.map((c,i)=>({label:c,ok:i===item.a}));
    body='';
  }
  app.innerHTML=topBar()+`<div class="screen"><div class="scr-head"><button class="back" onclick="go('home')">← ออก</button>
    <div class="scr-title">${qMode==='pre'?'📝 แบบทดสอบก่อนเรียน':'🏁 แบบทดสอบหลังเรียน'}</div></div>
    <div class="progress">${QBANK.map((_,i)=>`<div class="dot ${i<qIdx?'on':''} ${i===qIdx?'cur':''}"></div>`).join('')}</div>
    <div class="stage">
      <div class="ask">ข้อ ${qIdx+1}. ${item.q}</div>
      ${body}
      <div class="optgrid">
        ${qChoices.map((c,i)=>`<button class="opt" id="q${i}" onclick="quizAns(${i})">${c.label}</button>`).join('')}
      </div>
    </div></div>`;
}
function quizAns(i){
  if(qLock)return;qLock=true;
  const ok=qChoices[i].ok;
  if(ok)qScore++;
  if(qMode==='post'){ // feedback only on posttest
    const el=document.getElementById('q'+i);
    if(ok){sCorrect();el.classList.add('correct');}
    else{sWrong();el.classList.add('wrong');qChoices.forEach((c,j)=>{if(c.ok)document.getElementById('q'+j).classList.add('correct');});}
  } else { sClick(); document.getElementById('q'+i).style.outline='3px solid #143A74'; }
  qIdx++;
  setTimeout(quizRender, qMode==='post'?850:350);
}
function quizDone(){
  if(qMode==='pre')S.pre=qScore; else S.post=qScore;
  const pct=Math.round(qScore/QBANK.length*100);
  sWin();confetti();
  let extra='';
  if(qMode==='post'&&S.pre!=null){const diff=S.post-S.pre;
    extra=`<div class="cmp"><div class="cmpbox"><div class="l">ก่อนเรียน</div><div class="v" style="color:#5B7290">${S.pre}</div></div>
    <div class="cmpbox"><div class="l">หลังเรียน</div><div class="v" style="color:#2FBF71">${S.post}</div></div>
    <div class="cmpbox"><div class="l">พัฒนาขึ้น</div><div class="v" style="color:#F0509E">${diff>=0?'+':''}${diff}</div></div></div>`;}
  app.innerHTML=topBar()+`<div class="screen result">
    <div class="big">${pct>=80?'🎉':pct>=50?'😄':'💪'}</div>
    <div class="score">${qScore}/${QBANK.length}</div>
    <p style="color:var(--muted);margin:6px 0">${qMode==='pre'?'นี่คือคะแนนก่อนเรียน เริ่มเรียนบทเรียนกันเลย!':(pct>=80?'เยี่ยมมาก! เธอเก่งขึ้นมาก':'ทำได้ดี ลองทบทวนบทเรียนเพิ่มได้นะ')}</p>
    ${extra}
    ${qMode==='post'?'<button class="bigbtn" onclick="go(\'result\')">รับเกียรติบัตร 🏆</button>':'<button class="bigbtn" onclick="go(\'learn\')">ไปบทที่ 1 →</button>'}
    <button class="back" style="margin-left:8px" onclick="go('home')">สารบัญ</button>
  </div>`;
}

let learnDeg=50,dragging=false;
function renderLearn(){

  <div class="stage"><div class="panel" style="display:flex;flex-direction:column;align-items:center;">
    <div id="angHolder"></div><div class="readout" id="degOut"></div><div id="typeOut" style="font-weight:800;font-size:20px;"></div></div>
    <button class="bigbtn" onclick="markDone('learn')">เข้าใจแล้ว! รับ ⭐</button></div></div>`;
  drawLearn();setupDrag();
}
function drawLearn(){const sz=Math.min(300,window.innerWidth-90);
  document.getElementById('angHolder').innerHTML=angleSVG(learnDeg,sz,{handle:true});
  const t=typeOf(learnDeg);const o=document.getElementById('degOut');o.textContent=Math.round(learnDeg)+'°';o.style.color=t.color;
  document.getElementById('typeOut').innerHTML=`<span style="color:${t.color}">${t.th} (${t.en})</span>`;}
function setupDrag(){const svg=document.querySelector('#angHolder svg');if(!svg)return;
  const move=e=>{if(!dragging)return;e.preventDefault();const r=svg.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const px=(e.touches?e.touches[0].clientX:e.clientX)-cx,py=(e.touches?e.touches[0].clientY:e.clientY)-cy;
  let d=Math.round(-Math.atan2(py,px)*180/Math.PI);if(d<=0)d+=360;if(d>=360)d=359;if(d<1)d=1;learnDeg=d;drawLearn();};
  svg.addEventListener('mousedown',e=>{dragging=true;move(e);});svg.addEventListener('touchstart',e=>{dragging=true;move(e);},{passive:false});
  window.addEventListener('mousemove',move);window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',()=>dragging=false);window.addEventListener('touchend',()=>dragging=false);}

function bookSVG(){return `<svg width="140" height="100" viewBox="0 0 140 100"><path d="M70 75 L15 60 L15 35 L70 50 Z" fill="#9BC53D" stroke="#143A74" stroke-width="2"/>
 <path d="M70 75 L125 60 L125 35 L70 50 Z" fill="#2FBF71" stroke="#143A74" stroke-width="2"/><line x1="70" y1="50" x2="70" y2="78" stroke="#143A74" stroke-width="2"/></svg>`;}
function scissorSVG(){return `<svg width="120" height="120" viewBox="0 0 120 120"><line x1="60" y1="70" x2="105" y2="30" stroke="#5B7290" stroke-width="5" stroke-linecap="round"/>
 <line x1="60" y1="70" x2="100" y2="48" stroke="#00B4D8" stroke-width="5" stroke-linecap="round"/><circle cx="55" cy="80" r="9" fill="none" stroke="#F0509E" stroke-width="4"/>
 <circle cx="68" cy="83" r="9" fill="none" stroke="#9B5DE5" stroke-width="4"/><circle cx="60" cy="70" r="4" fill="#143A74"/></svg>`;}
function roofSVG(){return `<svg width="150" height="100" viewBox="0 0 150 100"><path d="M20 80 L75 35 L130 80" fill="none" stroke="#F0509E" stroke-width="6" stroke-linecap="round"/>
 <path d="M58 50 A30 30 0 0 0 92 50" fill="#9BC53D33" stroke="#9BC53D" stroke-width="3"/><rect x="35" y="80" width="80" height="3" fill="#5B7290"/></svg>`;}
let expIdx,expScore,expAnswered;
function renderExplore(){expIdx=0;expScore=0;nextExp();}
function nextExp(){
  if(expIdx>=OBJECTS.length)return expDone();
  expAnswered=false;const o=OBJECTS[expIdx];const t=typeOf(o.deg);
  let opts=[t.key];const others=TYPES.map(x=>x.key).filter(k=>k!==t.key).sort(()=>Math.random()-.5).slice(0,3);
  opts=opts.concat(others).sort(()=>Math.random()-.5);
  app.innerHTML=topBar()+`<div class="screen"><div class="scr-head"><button class="back" onclick="go('home')">← สารบัญ</button><div class="scr-title">🔍 บทที่ 4 มุมรอบตัวเรา</div></div>
  <div class="mascot-row">${mascot(64)}<div class="bubble">มองดูสิ่งของรอบตัวก็เจอมุมได้นะ! สิ่งนี้ทำมุมชนิดใด?</div></div>
  <div class="stage"><div class="panel" style="text-align:center"><div style="font-weight:700;color:var(--navy);margin-bottom:6px">${o.name}</div>${o.svg}</div>
  <div style="font-size:14px;color:var(--muted)">ข้อ ${expIdx+1}/${OBJECTS.length}</div>
  <div class="typewrap">${opts.map(k=>{const tt=TYPES.find(x=>x.key===k);return `<button class="typechip" id="ex_${k}" style="background:${tt.color}" onclick="ansExp('${k}')">${tt.th}</button>`}).join('')}</div></div></div>`;
}
function ansExp(key){if(expAnswered)return;expAnswered=true;const o=OBJECTS[expIdx];const correct=typeOf(o.deg).key;const picked=document.getElementById('ex_'+key);
  if(key===correct){expScore++;sCorrect();picked.style.outline='4px solid #143A74';}
  else{sWrong();picked.style.opacity='.4';const c=document.getElementById('ex_'+correct);if(c)c.style.outline='4px solid #143A74';}
  expIdx++;setTimeout(nextExp,900);}
function expDone(){if(expScore>=3)markDoneSilent('explore');
  if(expScore>=3){sWin();confetti();}else sWrong();
  app.innerHTML=topBar()+`<div class="screen result"><div class="big">${expScore>=3?'🎉':'💪'}</div><div class="score">${expScore}/${OBJECTS.length}</div>
  <p style="color:var(--muted);margin:8px 0 16px">${expScore>=3?'เก่งมาก! เธอหามุมรอบตัวได้แล้ว ⭐':'ลองอีกครั้งนะ'}</p>
  <button class="bigbtn" onclick="renderExplore()">เล่นอีกครั้ง 🔄</button><button class="back" style="margin-left:8px" onclick="go('home')">สารบัญ</button></div>`;}

/* ============ GAME 1: ล่ามุม ============ */
let gTime,gScore,gCombo,gAsk,gTimer,gLock;
function renderGameIntro(){
  app.innerHTML=topBar()+`<div class="screen"><div class="scr-head"><button class="back" onclick="go('home')">← สารบัญ</button><div class="scr-title">🎮 เกมล่ามุม</div></div>
  <div class="mascot-row">${mascot(76)}<div class="bubble">ฉันจะขอ<b>มุมชนิดหนึ่ง</b> เธอแตะมุมที่ถูกให้เร็วที่สุด! เวลา 40 วิ ตอบถูกต่อเนื่องได้ <b>คอมโบ</b> 🔥</div></div>
  <div class="stage"><div class="panel" style="text-align:center"><div style="font-size:15px;color:var(--muted)">สถิติสูงสุด</div>
  <div style="font-size:38px;font-weight:900;color:var(--navy)">${S.bestGame}</div></div>
  <button class="bigbtn" onclick="startGame()">เริ่มเล่น! 🚀</button></div></div>`;
}
function startGame(){gTime=40;gScore=0;gCombo=0;sClick();if(gTimer)clearInterval(gTimer);
  gTimer=setInterval(()=>{gTime-=0.1;const f=document.getElementById('tf');if(f)f.style.width=Math.max(0,gTime/40*100)+'%';if(gTime<=0){clearInterval(gTimer);endGame();}},100);gameRound();}
function gameRound(){if(gTime<=0)return;gLock=false;gAsk=TYPES[Math.floor(Math.random()*TYPES.length)];
  const pool=[35,55,75,90,110,135,160,180,210,250,300,330];const correctDeg=pickDeg(gAsk.key,pool);
  let opts=[{deg:correctDeg,ok:true}];let g=0;while(opts.length<4&&g++<50){const d=pool[Math.floor(Math.random()*pool.length)];if(typeOf(d).key!==gAsk.key&&!opts.some(o=>o.deg===d))opts.push({deg:d,ok:false});}
  opts=opts.sort(()=>Math.random()-.5);
  app.innerHTML=topBar()+`<div class="screen"><div class="scr-head"><button class="back" onclick="quitGame()">← ออก</button><div class="scr-title">🎮 เกมล่ามุม</div></div>
  <div class="stage"><div class="hud"><div>คะแนน <span style="color:var(--pink)">${gScore}</span></div><div class="combo">${gCombo>=2?('🔥 คอมโบ x'+gCombo):''}</div><div>⏱️ ${Math.ceil(gTime)}s</div></div>
  <div class="timerbar"><div class="timerfill" id="tf" style="width:${gTime/40*100}%"></div></div>
  <div class="ask">น้องโปรขอ <b style="background:${gAsk.color}">${gAsk.th}</b>!</div>
  <div class="optgrid">${opts.map((o,i)=>`<button class="opt" id="op${i}" onclick="pickGame(${i},${o.deg})">${angleSVG(o.deg,110,{deg:true})}</button>`).join('')}</div></div></div>`;
}
function pickDeg(key,pool){if(key==='right')return 90;if(key==='straight')return 180;const c=pool.filter(d=>typeOf(d).key===key);return c[Math.floor(Math.random()*c.length)];}
function pickGame(i,deg){if(gLock)return;gLock=true;const el=document.getElementById('op'+i);
  if(typeOf(deg).key===gAsk.key){gCombo++;const gain=10+(gCombo>=2?(gCombo-1)*5:0);gScore+=gain;sCorrect();el.classList.add('correct');el.innerHTML+=`<div style="color:var(--green);font-weight:800">+${gain}</div>`;}
  else{gCombo=0;sWrong();el.classList.add('wrong');}setTimeout(gameRound,500);}
function quitGame(){if(gTimer)clearInterval(gTimer);go('game');}
function endGame(){if(gScore>S.bestGame)S.bestGame=gScore;if(gScore>=70)markDoneSilent('game');
  const st=gScore>=120?3:gScore>=70?2:gScore>=30?1:0;if(st>0){sWin();confetti();}else sWrong();
  app.innerHTML=topBar()+`<div class="screen result"><div class="big">${st>=3?'🏆':st>=2?'🎉':st>=1?'😄':'💪'}</div>
  <div class="score">${gScore} คะแนน</div><div class="starline">${starStr(st,3)}</div>
  <p style="color:var(--muted);margin:8px 0 16px">สถิติสูงสุด: <b>${S.bestGame}</b></p>
  <button class="bigbtn" onclick="startGame()">เล่นอีกครั้ง 🔄</button><button class="back" style="margin-left:8px" onclick="go('home')">สารบัญ</button></div>`;}

/* ============ GAME 2: นาฬิกามหาสนุก ============ */
let ckRound,ckScore,ckAnswered;
const CLOCK_Q=[ {h:3,m:0,deg:90},{h:6,m:0,deg:180},{h:1,m:0,deg:30},{h:5,m:0,deg:150},{h:2,m:0,deg:60},{h:4,m:0,deg:120},{h:9,m:0,deg:90} ];
function clockFace(h,m,size){size=size||150;const c=size/2,r=size*0.4;
  const hourA=((h%12)+m/60)*30*Math.PI/180, minA=m*6*Math.PI/180;
  let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="#fff" stroke="#143A74" stroke-width="3"/>`;
  for(let i=0;i<12;i++){const a=i*30*Math.PI/180;s+=`<circle cx="${c+(r-6)*Math.sin(a)}" cy="${c-(r-6)*Math.cos(a)}" r="2" fill="#143A74"/>`;}
  s+=`<line x1="${c}" y1="${c}" x2="${c+r*0.5*Math.sin(hourA)}" y2="${c-r*0.5*Math.cos(hourA)}" stroke="#F0509E" stroke-width="5" stroke-linecap="round"/>`;
  s+=`<line x1="${c}" y1="${c}" x2="${c+r*0.78*Math.sin(minA)}" y2="${c-r*0.78*Math.cos(minA)}" stroke="#00B4D8" stroke-width="4" stroke-linecap="round"/>`;
  s+=`<circle cx="${c}" cy="${c}" r="4" fill="#143A74"/></svg>`;return s;}
function renderClockIntro(){
  app.innerHTML=topBar()+`<div class="screen"><div class="scr-head"><button class="back" onclick="go('home')">← สารบัญ</button><div class="scr-title">🕐 เกมนาฬิกามหาสนุก</div></div>
  <div class="mascot-row">${mascot(76)}<div class="bubble">เข็มนาฬิกาก็ทำมุมได้นะ! ดูเวลาแล้วทาย<b>ชนิดของมุม</b>ระหว่างเข็มสั้นกับเข็มยาวให้ถูก มี 7 ข้อ!</div></div>
  <div class="stage"><div class="panel" style="text-align:center">${clockFace(3,0,150)}<div style="color:var(--muted);font-size:14px">ตัวอย่าง: 3 นาฬิกา = มุมฉาก (90°)</div></div>
  <button class="bigbtn" onclick="startClock()">เริ่มเล่น! 🚀</button></div></div>`;
}
function startClock(){ckRound=0;ckScore=0;sClick();nextClock();}
function nextClock(){
  if(ckRound>=CLOCK_Q.length)return clockDone();
  ckAnswered=false;const q=CLOCK_Q[ckRound];const t=typeOf(q.deg);
  let opts=[t.key];const others=TYPES.map(x=>x.key).filter(k=>k!==t.key).sort(()=>Math.random()-.5).slice(0,3);opts=opts.concat(others).sort(()=>Math.random()-.5);
  app.innerHTML=topBar()+`<div class="screen"><div class="scr-head"><button class="back" onclick="go('clock')">← ออก</button><div class="scr-title">🕐 นาฬิกามหาสนุก · ข้อ ${ckRound+1}/${CLOCK_Q.length}</div></div>
  <div class="stage"><div class="ask">เวลา ${q.h} นาฬิกา · เข็มทำมุมชนิดใด?</div><div class="panel" style="text-align:center">${clockFace(q.h,q.m,170)}</div>
  <div class="typewrap">${opts.map(k=>{const tt=TYPES.find(x=>x.key===k);return `<button class="typechip" id="ck_${k}" style="background:${tt.color}" onclick="ansClock('${k}')">${tt.th}</button>`}).join('')}</div></div></div>`;
}
function ansClock(key){if(ckAnswered)return;ckAnswered=true;const q=CLOCK_Q[ckRound];const correct=typeOf(q.deg).key;const picked=document.getElementById('ck_'+key);
  if(key===correct){ckScore++;sCorrect();picked.style.outline='4px solid #143A74';}
  else{sWrong();picked.style.opacity='.4';const c=document.getElementById('ck_'+correct);if(c)c.style.outline='4px solid #143A74';}
  ckRound++;setTimeout(nextClock,900);}
function clockDone(){if(ckScore>S.bestClock)S.bestClock=ckScore;if(ckScore>=5)markDoneSilent('clock');
  if(ckScore>=4){sWin();confetti();}else sWrong();
  app.innerHTML=topBar()+`<div class="screen result"><div class="big">${ckScore>=6?'🏆':ckScore>=4?'🎉':'💪'}</div><div class="score">${ckScore}/${CLOCK_Q.length}</div>
  <p style="color:var(--muted);margin:8px 0 16px">สถิติสูงสุด: <b>${S.bestClock}</b> · ${ckScore>=5?'ผ่านแล้ว ⭐':'ทำ 5 ข้อขึ้นไปรับดาวนะ'}</p>
  <button class="bigbtn" onclick="startClock()">เล่นอีกครั้ง 🔄</button><button class="back" style="margin-left:8px" onclick="go('home')">สารบัญ</button></div>`;}

/* ============ RESULT + CERTIFICATE ============ */
function renderResult(){
  recalcStars();
  const lessons=['learn','types','symbol','explore'].filter(k=>S.done[k]).length;
  const diff=(S.pre!=null&&S.post!=null)?(S.post-S.pre):null;
  app.innerHTML=topBar()+`<div class="screen"><div class="scr-head no-print"><button class="back" onclick="go('home')">← สารบัญ</button><div class="scr-title">🏆 ผลการเรียนและเกียรติบัตร</div></div>
  <div class="cmp">
    <div class="cmpbox"><div class="l">ก่อนเรียน</div><div class="v" style="color:#5B7290">${S.pre!=null?S.pre+'/10':'-'}</div></div>
    <div class="cmpbox"><div class="l">หลังเรียน</div><div class="v" style="color:#2FBF71">${S.post!=null?S.post+'/10':'-'}</div></div>
    <div class="cmpbox"><div class="l">พัฒนาขึ้น</div><div class="v" style="color:#F0509E">${diff!=null?(diff>=0?'+':'')+diff:'-'}</div></div>
    <div class="cmpbox"><div class="l">บทเรียนที่จบ</div><div class="v" style="color:#9B5DE5">${lessons}/4</div></div>
  </div>
  <div class="stage no-print"><div class="panel" style="text-align:center">
    <div style="font-weight:700;color:var(--navy)">พิมพ์ชื่อของหนูเพื่อรับเกียรติบัตร</div>
    <input class="nameinput" id="nm" placeholder="ชื่อ-นามสกุล" value="${S.name}" oninput="S.name=this.value">
    <div style="margin-top:10px"><button class="bigbtn" onclick="makeCert()">ออกเกียรติบัตร 🎓</button></div>
  </div></div>
  <div id="certArea"></div>
  </div>`;
  if(S.name) makeCert();
}
function makeCert(){
  const nm=(document.getElementById('nm')&&document.getElementById('nm').value.trim())||S.name||'..............................';
  S.name=nm==='..............................'?'':nm;
  recalcStars();
  const today=new Date();const th=today.toLocaleDateString('th-TH-u-ca-buddhist',{year:'numeric',month:'long',day:'numeric'});
  document.getElementById('certArea').innerHTML=`
  <div id="cert">
    <div class="seal">🏆</div>
    <h2>เกียรติบัตรฉบับนี้ให้ไว้เพื่อแสดงว่า</h2>
    <div class="nm">${nm}</div>
    <div class="sub">ได้เรียนจบบทเรียนสำเร็จรูป เรื่อง <b>มุมมหาสนุก (Fun with Angles)</b><br>กลุ่มสาระการเรียนรู้คณิตศาสตร์ ชั้นประถมศึกษาปีที่ 4</div>
    <div class="row">
      <div><div class="l" style="color:#5B7290;font-size:13px">ดาวสะสม</div><div style="font-size:22px">${starStr(Math.min(S.stars,10),10)}</div></div>
    </div>
    <div class="sub">ก่อนเรียน ${S.pre!=null?S.pre:'-'}/10 → หลังเรียน ${S.post!=null?S.post:'-'}/10 คะแนน</div>
    <div class="sub" style="margin-top:10px">ให้ไว้ ณ วันที่ ${th}</div>
    <div style="margin-top:16px;color:var(--navy);font-weight:700">น้องโปร 🤖 · มุมมหาสนุก</div>
  </div>
  <div class="stage no-print" style="margin-top:14px"><button class="bigbtn" onclick="window.print()">🖨️ พิมพ์ / บันทึกเกียรติบัตร</button></div>`;
  sWin();confetti();
  document.getElementById('cert').scrollIntoView({behavior:'smooth'});
}

/* ============ MARK DONE ============ */
function markDone(k){if(!S.done[k]){S.done[k]=true;sStar();confetti();}else sClick();setTimeout(()=>go('home'),700);}
function markDoneSilent(k){S.done[k]=true;}

/* confetti */
function confetti(){const em=['⭐','🎉','✨','🟦','🟩','🟪','🌟'];for(let i=0;i<24;i++){const c=document.createElement('div');c.className='confetti';
c.textContent=em[Math.floor(Math.random()*em.length)];c.style.left=Math.random()*100+'%';c.style.animationDuration=(1.4+Math.random()*1.4)+'s';
c.style.fontSize=(16+Math.random()*16)+'px';document.body.appendChild(c);setTimeout(()=>c.remove(),2800);}}

/* router */
function render(){
  ({home:renderHome,howto:renderHowto,objective:renderObjective,learn:renderLearn,types:renderTypes,
    symbol:renderSymbol,explore:renderExplore,game:renderGameIntro,clock:renderClockIntro,result:renderResult}[S.screen]||renderHome)();
}
window.addEventListener('resize',()=>{if(S.screen==='learn'){drawLearn();setupDrag();}});
render();
</script>
</body>
</html>
